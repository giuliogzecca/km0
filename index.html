<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM0 - Il Mercato Trentino</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f6f8; text-align: center; }
        
        /* Barra superiore con il tasto */
        .barra-superiore { background-color: #ffffff; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: flex-end; padding-right: 30px; }
        .btn-nuovo { background-color: #2e7d32; color: white; padding: 12px 24px; border: none; border-radius: 20px; cursor: pointer; font-size: 16px; font-weight: bold; box-shadow: 0 3px 6px rgba(0,0,0,0.2); }
        .btn-nuovo:hover { background-color: #1b5e20; }

        /* Banner di benvenuto */
        .hero { background: url('2023-10-24_Background_Sezione_Hero.webp') center/cover no-repeat; color: white; padding: 60px 20px; position: relative; }
        .hero h1 { font-size: 42px; color: #ffb300; margin-top: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); }
        
        /* Griglia delle Sezioni */
        .titolo-sezione { font-size: 32px; color: #1b4332; margin: 40px 0 20px 0; }
        .griglia { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 20px; }
        .scheda-sezione { background: white; border: 3px solid #ffb300; border-radius: 15px; width: 280px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .scheda-sezione img { width: 100%; height: 180px; object-fit: cover; }
        .scheda-sezione h3 { font-size: 20px; color: #1b4332; padding: 15px 0; margin: 0; }

        /* Finestra Modale per l'Annuncio */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-contenuto { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; text-align: left; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .campo { margin-bottom: 15px; }
        .campo label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .campo input, .campo select, .campo textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .suggerimento { font-size: 13px; color: #0288d1; margin-top: 5px; font-weight: bold; display: none; }
        .azioni { display: flex; justify-content: space-between; margin-top: 20px; }
        .btn-invia { background-color: #0288d1; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-annulla { background-color: #d32f2f; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- BARRA SUPERIORE CON IL TASTO PER L'ANNUNCIO -->
    <div class="barra-superiore">
        <button class="btn-nuovo" onclick="apriModulo()">+ Inserisci Annuncio</button>
    </div>

    <!-- INTESTAZIONE DEL SITO -->
    <div class="hero">
        <img src="2023-10-25_Logo_Sito_Principale.png" alt="KM0 Logo" style="max-width: 250px;">
        <h1>IL MERCATO TRENTINO</h1>
    </div>

    <!-- CONTENUTI PRINCIPALI -->
    <h2 class="titolo-sezione">Esplora i Prodotti della Nostra Terra</h2>

    <div class="griglia">
        <!-- Sezione Orto -->
        <div class="scheda-sezione">
            <img src="2023-10-27_Galleria_Prodotto_01.jpg" alt="Orto & Frutteto">
            <h3>🍎 Orto & Frutteto</h3>
        </div>

        <!-- Sezione Formaggi -->
        <div class="scheda-sezione">
            <img src="2023-10-27_Galleria_Prodotto_02.jpg" alt="Malga & Formaggi">
            <h3>🧀 Malga & Formaggi</h3>
        </div>
    </div>

    <!-- MODULO INSERIMENTO ANNUNCIO -->
    <div id="finestraModulo" class="modal">
        <div class="modal-contenuto">
            <h2>Nuovo Annuncio</h2>
            <form id="formAnnuncio">
                <div class="campo">
                    <label for="titolo">Nome del prodotto:</label>
                    <input type="text" id="titolo" placeholder="Es. Pomodori, Miele..." oninput="suggerisciSezione()" required>
                    <div id="testoSuggerimento" class="suggerimento"></div>
                </div>

                <div class="campo">
                    <label for="sezione">Sezione del sito:</label>
                    <select id="sezione" required>
                        <option value="">-- Scegli una sezione --</option>
                        <option value="orto">Orto & Frutteto</option>
                        <option value="formaggi">Malga & Formaggi</option>
                        <option value="caserecci">Prodotti Caserecci</option>
                        <option value="altro">Altro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="prezzo">Prezzo (€):</label>
                    <input type="number" step="0.01" id="prezzo" placeholder="Es. 4.50" required>
                </div>

                <div class="campo">
                    <label for="descrizione">Descrizione:</label>
                    <textarea id="descrizione" rows="3" placeholder="Descrivi il prodotto..." required></textarea>
                </div>

                <div class="azioni">
                    <button type="button" class="btn-annulla" onclick="chiudiModulo()">Annulla</button>
                    <button type="submit" class="btn-invia">Pubblica Annuncio</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function apriModulo() { document.getElementById('finestraModulo').style.display = 'flex'; }
        function chiudiModulo() { document.getElementById('finestraModulo').style.display = 'none'; }
        
        function suggerisciSezione() {
            const testo = document.getElementById('titolo').value.toLowerCase();
            const menu = document.getElementById('sezione');
            const box = document.getElementById('testoSuggerimento');

            if (testo.includes("mela") || testo.includes("pomodor") || testo.includes("frutta")) {
                menu.value = "orto";
                box.innerText = "💡 Sezione consigliata: Orto & Frutteto";
                box.style.display = "block";
            } else if (testo.includes("formagg") || testo.includes("latte") || testo.includes("ricotta")) {
                menu.value = "formaggi";
                box.innerText = "💡 Sezione consigliata: Malga & Formaggi";
                box.style.display = "block";
            } else {
                box.style.display = "none";
            }
        }

        document.getElementById('formAnnuncio').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Annuncio pronto per la pubblicazione!');
            chiudiModulo();
        });
    </script>
</body>
</html>
