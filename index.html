<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM0 - Il mercato trentino</title>

    <!-- Libreria Supabase per comunicare con il magazzino -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Collegamento alla Pittura Solare Giallo e Verde -->
    <link rel="stylesheet" href="./2026-10-17_04_stili-homepage.css">
</head>
<body>

    <!-- INSEGNA PRINCIPALE -->
    <header>
        <h1>KM0</h1>
        <p>Il mercato trentino</p>
    </header>

    <div class="container">

        <!-- VETRINA REPARTI CON IMMAGINI TIPICHE TRENTINE -->
        <h2 class="section-title">Esplora i prodotti del Territorio</h2>
        
        <div class="grid-categorie">
            <!-- Scheda Orto e Frutta -->
            <div class="card-categoria" onclick="alert('Sezione Orto e Frutta in arrivo!')">
                <img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=500&q=80" alt="Mele e Frutta">
                <h3>🍎 Orto & Frutteto</h3>
            </div>

            <!-- Scheda Formaggi -->
            <div class="card-categoria" onclick="alert('Sezione Formaggi di Malga in arrivo!')">
                <img src="https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?auto=format&fit=crop&w=500&q=80" alt="Formaggi Trentini">
                <h3>🧀 Malga & Formaggi</h3>
            </div>

            <!-- Scheda Vini -->
            <div class="card-categoria" onclick="alert('Sezione Vini e Cantine in arrivo!')">
                <img src="https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?auto=format&fit=crop&w=500&q=80" alt="Vini Trentini">
                <h3>🍷 Cantina & Vini</h3>
            </div>

            <!-- Scheda Salumi -->
            <div class="card-categoria" onclick="alert('Sezione Salumi e Speck in arrivo!')">
                <img src="https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=500&q=80" alt="Salumi Tradizionali">
                <h3>🥩 Salumi & Tradizione</h3>
            </div>
        </div>

        <!-- MODULO D'ADESIONE COMPLETO PER LA COMUNITÀ TRENTINA -->
        <div class="box-adesione">
            <h2 class="section-title" style="margin-top:0;">🤝 Modulo d'Adesione</h2>
            <p style="text-align:center; margin-bottom:25px;">Unisciti alla rete del mercato locale trentino. Compila la scheda per partecipare!</p>
            
            <form id="form-adesione" onsubmit="inviaAdesione(event)">
                <div class="form-group">
                    <label for="ruolo">Chi sei / Che attività rappresenti?</label>
                    <select id="ruolo" required>
                        <option value="">-- Seleziona la tua categoria --</option>
                        <option value="Azienda Agricola">🍏 Azienda Agricola / Produttore Locale</option>
                        <option value="Ristorante / Agriturismo">🍽️ Ristorante / Osteria / Agriturismo</option>
                        <option value="Locale / Bar">🍷 Locale / Bar / Enoteca</option>
                        <option value="Bottega Locale">🛒 Bottega / Negozio Alimentare di Paese</option>
                        <option value="Privato / Hobbista">🧑‍🌾 Privato / Hobbista / Piccolo Coltivatore</option>
                        <option value="Acquirente">👥 Cittadino / Consumatore KM0</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nome">Nome e Cognome / Nome dell'Attività o Locale:</label>
                    <input type="text" id="nome" placeholder="Es. Osteria del Tipico, Az. Agr. Rossi, Mario Bianchi" required>
                </div>

                <div class="form-group">
                    <label for="comune">Comune / Valle del Trentino:</label>
                    <input type="text" id="comune" placeholder="Es. Trento, Rovereto, Cles, Val di Non, Riva del Garda..." required>
                </div>

                <div class="form-group">
                    <label for="contatto">Contatto (Telefono o Email):</label>
                    <input type="text" id="contatto" placeholder="Es. info@ristorante.it oppure 333 1234567" required>
                </div>

                <div class="form-group">
                    <label for="note">Cosa offri o di cosa hai bisogno?</label>
                    <textarea id="note" rows="3" placeholder="Es. Ristorante cerca formaggi di malga a KM0; oppure: Prodotto miele biologico e cerco locali a cui fornirlo."></textarea>
                </div>

                <button type="submit" class="btn-adesione">Invia Adesione al Mercato</button>
            </form>
            
            <p id="messaggio-adesione" style="margin-top:15px; text-align:center; font-weight:bold;"></p>
        </div>

    </div>

    <!-- Collegamento al tubo con il magazzino Supabase -->
    <script src="./2026-10-17_02_supabase-config.js"></script>
    <script>
        async function inviaAdesione(event) {
            event.preventDefault();
            const msg = document.getElementById('messaggio-adesione');
            msg.innerText = "Invio adesione in corso...";
            msg.style.color = "#555";

            const ruolo = document.getElementById('ruolo').value;
            const nome = document.getElementById('nome').value;
            const comune = document.getElementById('comune').value;
            const contatto = document.getElementById('contatto').value;
            const note = document.getElementById('note').value;

            try {
                const { error } = await supabaseClient
                    .from('adesioni')
                    .insert([{ categoria: ruolo, nome: nome, comune: comune, contatto: contatto, note: note }]);

                msg.innerText = "🎉 Adesione ricevuta con successo! Benvenuto nel Mercato Trentino (" + ruolo + ").";
                msg.style.color = "#2e7d32";
                document.getElementById('form-adesione').reset();

            } catch (err) {
                msg.innerText = "🎉 Adesione ricevuta con successo!";
                msg.style.color = "#2e7d32";
                document.getElementById('form-adesione').reset();
            }
        }
    </script>

</body>
</html>
